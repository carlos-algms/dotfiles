# Font
font_family Hack
# font_family JetBrains Mono
# font_family Cascadia Code
font_size 14
modify_font cell_height 120%
italic_font auto
bold_italic_font auto
disable_ligatures always
# font_features JetBrainsMonoNFM-Regular -liga
# font_features none
# !==
# hide_window_decorations titlebar-only
# window_margin_width 10
cursor_trail 3

enable_audio_bell no

# tab_bar_style powerline
# tab_powerline_style round
# tab_bar_edge top
tab_bar_margin_width    20
tab_bar_margin_height    0
tab_bar_style separator
tab_separator ""
tab_title_template         "{fmt.bg._303030}{fmt.fg._c6c6c6} {index} - {title.split('/')[-1]} {fmt.fg.default}{fmt.bg.default}|"
active_tab_title_template  "{fmt.bg._80a0ff}{fmt.fg._080808} {index} - {title.split('/')[-1]} {fmt.fg.default}{fmt.bg.default}|"

remember_window_size yes
enabled_layouts fat:bias=80;full_size=0;mirrored=false,tall:bias=65;full_size=1;mirrored=false,stack

# https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts
clear_all_shortcuts yes

# https://sw.kovidgoyal.net/kitty/conf/#opt-kitty.macos_option_as_alt
# Mac uses Alt as modifier to insert unicode chars, and breaks Nvim and other Apps expecting an Alt + key combination.
macos_option_as_alt left

# Map § (section sign) to backtick ` for British keyboard layout
map § send_text all `
map shift+§ send_text all ~

# map cmd+f launch --type=overlay --stdin-source=@screen_scrollback /opt/homebrew/bin/fzf --no-sort --no-mouse --exact -i
# The default scroll behaves like `less` and highlight matches in place, while fzf hides non-matching lines, ending up without any context.
map cmd+f show_scrollback

map cmd+ctrl+, load_config_file

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+k clear_terminal to_cursor active

# emoji
map cmd+ctrl+shift+space kitten unicode_input

# map cmd+r start_resizing_window
# another one that doesn't work with Cmd on Mac
# map cmd+alt+l next_layout

# Handed to herdr (split_vertical) — see herdr/config.toml
# map cmd+enter new_window_with_cwd
# map ctrl+` toggle_layout stack
# Handed to herdr (next_tab / previous_tab) — see herdr/config.toml
# map cmd+] next_window
# map cmd+[ previous_window

# Disabled, as I don't expect to have kitty splits
# map alt+1 first_window
# map alt+2 second_window
# map alt+3 third_window
# map alt+4 fourth_window
# map alt+5 fifth_window

# ctrl+h/j/k/l are Neovim window navigation, kitty must not bind them.

# Remote control, required by kitty-ssh.conf's forward_remote_control
allow_remote_control yes
share_connections yes
listen_on unix:/tmp/mykitty

# Switch focus to the neighboring window in the indicated direction
map cmd+shift+left neighboring_window left
map cmd+shift+right neighboring_window right
map cmd+shift+up neighboring_window up
map cmd+shift+down neighboring_window down

# vim style movement
# Freed for herdr: j/k are workspace nav, h/l left unbound — see herdr/config.toml
# Inside herdr the panes are herdr's, not kitty windows, so these were dead weight.
# The cmd+shift+arrows above still navigate kitty windows outside herdr.
# map cmd+shift+h neighboring_window left
# map cmd+shift+l neighboring_window right
# map cmd+shift+k neighboring_window up
# map cmd+shift+j neighboring_window down

# Rotate/invert split order
map cmd+alt+j move_window bottom
map cmd+alt+k move_window up

map cmd+n new_os_window
# map cmd+shift+t detach_tab # Move the tab, and all its split panes, to a new OS window
map cmd+shift+t detach_tab ask

# Handed to herdr (new_tab) — see herdr/config.toml
# map cmd+t new_tab

# cmd+t belongs to herdr, so kitty tabs need their own chord.
map cmd+shift+n new_tab_with_cwd
# Remote herdr in its own kitty tab. Not from inside a herdr pane: herdr blocks
# nested sessions, and --remote draws a full-screen client.
# Absolute path: `launch` execs with no shell, and kitty's PATH (from launchd)
# lacks /opt/homebrew/bin. A login shell does not help either, since brew
# shellenv runs from .zshrc (interactive only), not .zprofile.
# Opening the tab from inside a herdr pane also leaks that pane's HERDR_* vars:
# HERDR_ENV makes herdr refuse to start (thinks it is nested) and
# HERDR_SOCKET_PATH would point the client at the local server. Blank them.
map cmd+shift+s launch --type=tab --tab-title "HP remote" --env HERDR_ENV= --env HERDR_SOCKET_PATH= --env HERDR_PANE_ID= --env HERDR_TAB_ID= --env HERDR_WORKSPACE_ID= /opt/homebrew/bin/herdr --remote hp

map shift+cmd+i set_tab_title
map cmd+shift+. move_tab_forward
map cmd+shift+, move_tab_backward
map cmd+shift+i set_tab_title
map cmd+alt+tab select_tab
# Handed to herdr (switch_tab = "cmd+1..9") — see herdr/config.toml
# map cmd+1 goto_tab 1
# map cmd+2 goto_tab 2
# map cmd+3 goto_tab 3
# map cmd+4 goto_tab 4
# map cmd+5 goto_tab 5
# map cmd+6 goto_tab 6
# map cmd+7 goto_tab 7
# map cmd+8 goto_tab 8
# map cmd+9 goto_tab 9

map cmd+plus change_font_size all +2.0
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0
