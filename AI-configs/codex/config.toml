[tui]
status_line = ["project-name", "git-branch", "model-with-reasoning", "context-used", "context-window-size", "estimated-thread-cost"]
vim_mode_default = true
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 3

[plugins."crit@local"]
enabled = true

[plugins."slack@openai-curated"]
enabled = false

[plugins."slack@openai-curated-remote"]
enabled = true

